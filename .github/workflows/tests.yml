# Automated tests for dsh-cache-guard on every push and pull request.
#
# Validates:
# - The plugin load contract of both halves (function-plugin shape, no default export)
# - The cold re-read pricing, the plan builder, and the decision/dialog logic
# - The host endpoints and the browser half's loader contract
# - The guard over the REAL compaction engine, meter, and pruner, driven through
#   the engine's own `agent/pre-step` path
# - The generated presets composing in a REAL Loader, patch inside the group
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm run test:unit
      - name: Run integration tests
        run: npm run test:integration
